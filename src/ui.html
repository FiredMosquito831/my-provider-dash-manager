<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>multi-acc-manager</title>
  <style>
    :root { --bg:#1b1d22; --panel:#23262d; --panel2:#2a2e37; --text:#e6e8ee; --muted:#9aa1af; --accent:#4f8cff; --warn:#ffb224; }
    * { box-sizing:border-box; margin:0; }
    body { height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:13px/1.4 "Segoe UI",system-ui,sans-serif; overflow:hidden; user-select:none; }
    #strip { height:48px; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--panel); border-bottom:1px solid #000; flex:none; }
    #services { display:flex; gap:4px; }
    .svc { display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:6px; background:var(--panel2); cursor:pointer; }
    .svc:hover { filter:brightness(1.2); }
    .dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .add { color:var(--muted); font-weight:700; padding:0 2px; }
    .add:hover { color:var(--text); }
    #tabs { display:flex; gap:4px; flex:1; overflow-x:auto; overflow-y:hidden; }
    .tab { display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:6px; color:var(--muted); cursor:pointer; max-width:210px; white-space:nowrap; flex:none; }
    .tab.active { background:var(--panel2); color:var(--text); outline:1px solid #3a3f4a; }
    .tab .label { overflow:hidden; text-overflow:ellipsis; }
    .tab .state { width:7px; height:7px; border-radius:50%; flex:none; }
    .tab .state.signin { background:var(--warn); }
    .tab .close { color:var(--muted); }
    .tab .close:hover { color:#ff6b6b; }
    #right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    #mem { color:var(--muted); font-variant-numeric:tabular-nums; }
    button.act { background:var(--panel2); color:var(--text); border:0; border-radius:6px; padding:5px 10px; cursor:pointer; }
    button.act:hover { filter:brightness(1.2); }
    #content { position:relative; flex:1; }
    #home { position:absolute; inset:0; overflow-y:auto; padding:24px; }
    #home h2 { font-size:15px; font-weight:600; margin-bottom:4px; }
    #home .sub { color:var(--muted); margin-bottom:18px; }
    .svcgroup { margin-bottom:22px; }
    .svcgroup .head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .svcgroup .head .name { font-weight:600; }
    .svcgroup .head .policy { color:var(--muted); font-size:11px; }
    .cards { display:flex; flex-wrap:wrap; gap:10px; }
    .card { width:190px; background:var(--panel); border:1px solid #31353f; border-radius:10px; padding:12px; cursor:pointer; }
    .card:hover { border-color:var(--accent); }
    .card .top { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
    .card .label { font-weight:600; overflow:hidden; text-overflow:ellipsis; }
    .card .meta { color:var(--muted); font-size:11px; min-height:15px; }
    .card .meta .warn { color:var(--warn); }
    .card .gear { margin-left:auto; color:var(--muted); font-size:12px; }
    .card .gear:hover { color:var(--text); }
    .card.addcard { display:flex; align-items:center; justify-content:center; color:var(--muted); background:transparent; border-style:dashed; }
    .card.addcard:hover { color:var(--text); }
    #modal-back { position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; }
    #modal { width:340px; background:var(--panel); border:1px solid #3a3f4a; border-radius:12px; padding:16px; }
    #modal h3 { font-size:14px; margin-bottom:10px; }
    #modal label { display:block; color:var(--muted); font-size:11px; margin:8px 0 3px; }
    #modal input[type=text] { width:100%; background:var(--panel2); border:1px solid #3a3f4a; color:var(--text); border-radius:6px; padding:6px 8px; }
    #modal .row { display:flex; gap:8px; margin-top:14px; }
    #modal .row button { flex:1; }
    #modal .btn-primary { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 10px; cursor:pointer; }
    #modal .btn-plain { background:var(--panel2); color:var(--text); border:0; border-radius:6px; padding:7px 10px; cursor:pointer; }
    #modal .btn-danger { background:#7f2b2b; color:#fff; border:0; border-radius:6px; padding:7px 10px; cursor:pointer; }
    #modal .note { color:var(--muted); font-size:11px; margin-top:10px; line-height:1.5; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div id="strip">
    <div id="services"></div>
    <div id="tabs"></div>
    <div id="right">
      <span id="mem">–</span>
      <button class="act" id="ext-btn" title="Open active tab in system browser (Google OAuth / Turnstile fallback)" hidden>↗ Browser</button>
      <button class="act" id="hib-all" title="Sleep all tabs (Ctrl+Shift+W) — sessions stay on disk">Sleep all</button>
    </div>
  </div>
  <div id="content">
    <div id="home"></div>
    <div id="modal-back" hidden>
      <div id="modal"></div>
    </div>
  </div>
  <script src="ui.js"></script>
</body>
</html>
