<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Provider Dash Manager</title>
  <style>
    :root {
      --bg:#0f172a; --panel:#161d2e; --panel2:#1f2739; --panel3:#272f42;
      --text:#f8fafc; --muted:#94a3b8; --border:#2b3346;
      --accent:#4f8cff; --ok:#22c55e; --warn:#ffb224; --danger:#ef4444;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
      --rail:240px; --strip:48px;
    }
    * { box-sizing:border-box; margin:0; }
    body {
      height:100vh; display:flex; flex-direction:column; overflow:hidden;
      background:var(--bg); color:var(--text); user-select:none;
      font:13px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    }
    button { font:inherit; cursor:pointer; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
    svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    .dot { width:8px; height:8px; border-radius:50%; flex:none; }

    /* ---------- top strip: OPEN TABS ONLY ---------- */
    #strip { height:var(--strip); flex:none; display:flex; align-items:center; gap:var(--s2);
             padding:0 var(--s2); background:var(--panel); border-bottom:1px solid var(--border); }
    #tabctl { display:flex; align-items:center; gap:var(--s1); flex:none; }
    .ctlbtn { display:flex; align-items:center; gap:6px; height:30px; padding:0 9px; border:0; border-radius:7px;
              background:var(--panel2); color:var(--muted); transition:background .18s, color .18s; }
    .ctlbtn:hover { background:var(--panel3); color:var(--text); }
    .ctlbtn.on { background:var(--accent); color:#fff; }
    #filter { height:30px; width:120px; padding:0 8px 0 26px; border:1px solid var(--border); border-radius:7px;
              background:var(--panel2) no-repeat 8px center; color:var(--text); font:inherit; transition:width .18s, border-color .18s; }
    #filter:focus { width:170px; border-color:var(--accent); outline:none; }
    .filterwrap { position:relative; display:flex; align-items:center; }
    .filterwrap svg { position:absolute; left:7px; color:var(--muted); pointer-events:none; }

    #tabs { display:flex; align-items:center; gap:var(--s1); flex:1 1 0; min-width:0; overflow-x:auto; overflow-y:hidden; height:100%; }
    #nav { display:flex; align-items:center; gap:4px; flex:0 1 auto; min-width:0; }
    #nav[hidden] { display:none; }
    .navbtn { padding:0 6px; }
    .navbtn:disabled { opacity:.35; cursor:default; }
    .navbtn:disabled:hover { background:var(--panel2); color:var(--muted); }
    #addr { height:30px; width:300px; min-width:140px; max-width:40vw; padding:0 9px; border:1px solid var(--border); border-radius:7px;
            background:var(--panel2); color:var(--text); font:inherit; font-size:12px; text-overflow:ellipsis; transition:border-color .18s; }
    #addr:focus { border-color:var(--accent); outline:none; }
    #addr.loading { border-color:var(--accent); background:linear-gradient(90deg, var(--panel3) 0 30%, var(--panel2) 60% 100%) 0 0/200% 100%; animation:addrload 1.2s linear infinite; }
    @keyframes addrload { from { background-position:200% 0; } to { background-position:0 0; } }
    #tabs::-webkit-scrollbar { height:0; }
    .tabgroup { display:flex; align-items:center; gap:var(--s1); padding-left:var(--s2); flex:none;
                border-left:1px solid var(--border); height:30px; }
    .tabgroup:first-child { border-left:0; padding-left:0; }
    .grouplabel { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px;
                  text-transform:uppercase; letter-spacing:.04em; padding-right:2px; cursor:pointer; }
    .grouplabel:hover { color:var(--text); }
    .tab { display:flex; align-items:center; gap:6px; height:30px; padding:0 6px 0 8px; border-radius:7px; flex:none;
           color:var(--muted); background:transparent; max-width:210px; white-space:nowrap; cursor:pointer;
           border:1px solid transparent; transition:background .18s, color .18s, border-color .18s; }
    .tab:hover { background:var(--panel2); color:var(--text); }
    .tab.active { background:var(--panel3); color:var(--text); border-color:#3d465c; }
    .tab.asleep { opacity:.55; }
    .tab .label { overflow:hidden; text-overflow:ellipsis; }
    .tab .sig { width:6px; height:6px; border-radius:50%; background:var(--warn); flex:none; }
    .tabx { display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:5px;
            border:0; background:transparent; color:var(--muted); padding:0; }
    .tabx:hover { background:#0006; color:var(--danger); }
    .tabx svg { width:12px; height:12px; }
    #right { flex:none; display:flex; align-items:center; gap:var(--s2); padding-left:var(--s2); }
    #mem { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }

    /* ---------- body: left rail + content ---------- */
    #body { flex:1; display:flex; min-height:0; }
    #rail { width:var(--rail); flex:none; background:var(--panel); border-right:1px solid var(--border);
            display:flex; flex-direction:column; overflow:hidden; }
    #railtop { flex:none; padding:var(--s2); border-bottom:1px solid var(--border); }
    #homebtn { display:flex; align-items:center; gap:var(--s2); width:100%; height:34px; padding:0 10px;
               border:0; border-radius:8px; background:var(--panel2); color:var(--text); font-weight:600;
               transition:background .18s; }
    #homebtn:hover { background:var(--panel3); }
    #homebtn.active { background:var(--accent); color:#fff; }
    #railscroll { flex:1; overflow-y:auto; padding:var(--s2) var(--s2) var(--s5); }
    #railscroll::-webkit-scrollbar { width:8px; }
    #railscroll::-webkit-scrollbar-thumb { background:#2c3547; border-radius:4px; }
    .prov { margin-bottom:var(--s1); }
    .provhead { display:flex; align-items:center; gap:6px; height:30px; padding:0 6px; border-radius:7px;
                color:var(--text); cursor:pointer; transition:background .18s; }
    .provhead:hover { background:var(--panel2); }
    .provhead .chev { color:var(--muted); transition:transform .18s; }
    .provhead.collapsed .chev { transform:rotate(-90deg); }
    .provhead .pname { flex:1; font-weight:600; font-size:12px; overflow:hidden; text-overflow:ellipsis; }
    .provhead .count { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
    .provadd { display:flex; align-items:center; justify-content:center; width:22px; height:22px; border:0;
               border-radius:6px; background:transparent; color:var(--muted); padding:0; }
    .provadd:hover { background:var(--panel3); color:var(--text); }
    .acct { display:flex; align-items:center; gap:7px; height:32px; margin-left:14px; padding:0 4px 0 8px;
            border-radius:7px; color:var(--muted); cursor:pointer; transition:background .18s, color .18s; }
    .acct:hover { background:var(--panel2); color:var(--text); }
    .acct.open { color:var(--text); }
    .acct.active { background:var(--panel3); color:var(--text); }
    .acct .aname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .acct .badge { font-size:10px; padding:1px 5px; border-radius:4px; background:#0006; color:var(--muted); flex:none; }
    .acct .badge.live { color:var(--ok); }
    .acct .badge.signin { color:var(--warn); }
    /* hidden actions must not reserve space, or account names truncate needlessly */
    .acts { display:none; align-items:center; gap:2px; flex:none; }
    .acct:hover .acts, .acct.active .acts { display:flex; }
    .acct:hover .badge, .acct.active .badge { display:none; }
    .act { display:flex; align-items:center; justify-content:center; width:22px; height:22px; border:0;
           border-radius:6px; background:transparent; color:var(--muted); padding:0; }
    .act:hover { background:#0007; color:var(--text); }
    .act svg { width:13px; height:13px; }
    .emptyhint { color:var(--muted); font-size:11px; margin:2px 0 6px 22px; }
    .picker .pickgroup { margin:6px 0 10px; }
    .picker .picklabel { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:0 0 4px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid var(--border); border-radius:14px;
            background:var(--panel2); color:var(--text); font-size:12px; cursor:pointer; transition:background .18s, border-color .18s; }
    .chip:hover { background:var(--panel3); border-color:var(--accent); }
    .chip .dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .pickscroll { max-height:60vh; overflow-y:auto; margin-top:8px; }
    #railfoot { flex:none; padding:var(--s2); border-top:1px solid var(--border); display:flex; gap:6px; }
    #railfoot .ctlbtn { flex:1; justify-content:center; font-size:12px; }

    #content { position:relative; flex:1; min-width:0; }
    #home { position:absolute; inset:0; overflow-y:auto; padding:var(--s5); }
    #home h2 { font-size:15px; font-weight:600; margin-bottom:var(--s1); }
    #home .sub { color:var(--muted); margin-bottom:var(--s5); display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
    #home input[type=number] { width:3.5em; background:var(--panel2); color:var(--text); border:1px solid var(--border);
                               border-radius:6px; padding:3px 6px; font:inherit; }
    .svcgroup { margin-bottom:var(--s5); }
    .svcgroup .head { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s3); }
    .svcgroup .head .name { font-weight:600; }
    .svcgroup .head .policy { color:var(--muted); font-size:11px; }
    .cards { display:flex; flex-wrap:wrap; gap:var(--s3); }
    .card { width:212px; background:var(--panel); border:1px solid var(--border); border-radius:10px;
            padding:var(--s3); cursor:pointer; transition:border-color .18s, background .18s; }
    .card:hover { border-color:var(--accent); background:var(--panel2); }
    .card .top { display:flex; align-items:center; gap:7px; margin-bottom:var(--s1); }
    .card .label { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .card .meta { color:var(--muted); font-size:11px; min-height:16px; line-height:1.45; }
    .card .meta .warn { color:var(--warn); }
    .card .meta .ok { color:var(--ok); }
    .card .gear { margin-left:auto; display:flex; align-items:center; justify-content:center; width:22px; height:22px;
                  border:0; border-radius:6px; background:transparent; color:var(--muted); padding:0; }
    .card .gear:hover { background:var(--panel3); color:var(--text); }
    .card.addcard { display:flex; align-items:center; justify-content:center; gap:6px; color:var(--muted);
                    background:transparent; border-style:dashed; }
    .card.addcard:hover { color:var(--text); }

    /* ---------- modal ---------- */
    #modal-back { position:absolute; inset:0; background:#000a; display:flex; align-items:center; justify-content:center; z-index:20; }
    #modal { width:370px; max-height:90%; overflow-y:auto; background:var(--panel); border:1px solid #3a445c;
             border-radius:12px; padding:var(--s4); }
    #modal h3 { font-size:14px; margin-bottom:var(--s2); }
    #modal label { display:block; color:var(--muted); font-size:11px; margin:10px 0 4px; }
    #modal input[type=text], #modal input[type=password] { width:100%; background:var(--panel2); border:1px solid var(--border);
      color:var(--text); border-radius:7px; padding:7px 9px; font:inherit; }
    #modal input:focus { border-color:var(--accent); outline:none; }
    #modal .row { display:flex; gap:var(--s2); margin-top:var(--s3); }
    #modal .row button { flex:1; }
    .btn-primary { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:8px 10px; }
    .btn-primary:disabled { opacity:.45; cursor:not-allowed; }
    .btn-plain { background:var(--panel2); color:var(--text); border:0; border-radius:7px; padding:8px 10px; }
    .btn-plain:hover { background:var(--panel3); }
    .btn-danger { background:#7f2b2b; color:#fff; border:0; border-radius:7px; padding:8px 10px; }
    #modal .note { color:var(--muted); font-size:11px; margin-top:var(--s3); line-height:1.55; }
    [hidden] { display:none !important; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div id="strip">
    <div id="tabctl"></div>
    <div id="tabs"></div>
    <div id="nav" hidden>
      <button class="ctlbtn navbtn" id="nav-back" title="Back (Alt+Left)" aria-label="Back"></button>
      <button class="ctlbtn navbtn" id="nav-fwd" title="Forward (Alt+Right)" aria-label="Forward"></button>
      <button class="ctlbtn navbtn" id="nav-reload" title="Reload (Ctrl+R / F5)" aria-label="Reload"></button>
      <button class="ctlbtn navbtn" id="nav-dash" title="Back to this account's dashboard (Alt+Home)" aria-label="Dashboard"></button>
      <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Address (Ctrl+L)" title="Current page — type an address and press Enter to go there inside this account's session" />
    </div>
    <div id="right">
      <span id="mem">–</span>
      <button class="ctlbtn" id="ext-btn" title="Open the active tab in your system browser" hidden></button>
      <button class="ctlbtn" id="hib-all" title="Sleep all tabs (Ctrl+Shift+W) — they stay in the strip">Sleep all</button>
    </div>
  </div>
  <div id="body">
    <div id="rail">
      <div id="railtop"></div>
      <div id="railscroll"></div>
      <div id="railfoot"></div>
    </div>
    <div id="content">
      <div id="home"></div>
      <div id="modal-back" hidden><div id="modal"></div></div>
    </div>
  </div>
  <script src="ui.js"></script>
</body>
</html>
