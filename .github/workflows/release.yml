name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Guard: the tag must match package.json, or the GitHub release and the npm package would
      # disagree about what this version is.
      - name: Check the tag matches package.json
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg"

      # Pre-create the release so electron-builder never races itself creating it twice
      # (that race silently dropped the installer upload on v0.2.0 — only the blockmap landed).
      - name: Ensure draft release exists
        run: gh release create "$env:GITHUB_REF_NAME" --draft --title "$env:GITHUB_REF_NAME" --notes "See docs/CHANGELOG.md" 2>$null; exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: upload anything electron-builder missed, then publish.
      - name: Upload artifacts and publish
        run: |
          gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist/*.exe, dist/latest.yml, dist/*.blockmap | ForEach-Object { $_.FullName }) --clobber
          gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The npm package is the installer CLI (npx my-provider-dash-manager). It must move with the
      # release, or `npx` keeps pointing at an older installer than the GitHub release offers.
      # Needs an NPM_TOKEN repository secret of type "Automation" (classic tokens fail 2FA with EOTP).
      # continue-on-error: the GitHub release has already published by this point, so a failure here
      # must not fail the whole release. It reports loudly instead, and the next step makes the
      # mismatch impossible to miss.
      - name: Publish to npm
        id: npmpublish
        continue-on-error: true
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "my-provider-dash-manager@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "npm already has ${GITHUB_REF_NAME#v} — nothing to publish"
          else
            npm publish --access public
          fi

      # Always report whether npm actually matches the tag, whatever happened above.
      - name: Verify npm matches the release
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(npm view my-provider-dash-manager version 2>/dev/null || echo "none")
          if [ "$got" = "$want" ]; then
            echo "npm is at $got — matches the release"
          else
            echo "::warning::npm is at $got but this release is $want. The npm package was NOT updated."
            echo "::warning::Publishing needs an **Automation** npm token in the NPM_TOKEN secret — classic and login-session tokens fail with EOTP because the account enforces 2FA for writes."
            echo "::warning::Until then, publish manually: npm publish --access public"
          fi
      # Installer is unsigned (SmartScreen warns); code signing is tracked in the working notes.
